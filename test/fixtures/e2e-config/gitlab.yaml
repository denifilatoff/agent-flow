apiVersion: agent-flow/v1alpha1
kind: ControllerConfig
configuration:
  repository: __CONFIG_REPOSITORY__
  flow: config/flows/development.yaml
  catalog: config/agents.yaml
providers:
  gitlab:
    apiUrl: __API_URL__
    tokenEnv: GITLAB_TOKEN
    repositories: [group/project]
polling:
  intervalSeconds: 60
  maxCallsPerMinute: 20
  quotaReservePercent: 25
runtime:
  concurrency: 2
  dataDirectory: __DATA_DIRECTORY__
  healthPort: __HEALTH_PORT__
