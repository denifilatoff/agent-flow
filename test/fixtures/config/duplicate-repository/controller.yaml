apiVersion: agent-flow/v1alpha1
kind: ControllerConfig
configuration:
  repository: /config
  flow: config/flows/development.yaml
  catalog: config/agents.yaml
providers:
  github:
    apiUrl: https://api.github.com
    tokenEnv: GITHUB_TOKEN
    repositories: [example-owner/example-repository]
  gitlab:
    apiUrl: https://gitlab.example.com/api/v4
    tokenEnv: GITLAB_TOKEN
    repositories: [example-owner/example-repository]
polling:
  intervalSeconds: 300
  maxCallsPerMinute: 20
  quotaReservePercent: 25
runtime:
  concurrency: 4
  dataDirectory: /data
  healthPort: 8080
