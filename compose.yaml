services:
  controller:
    init: true
    build:
      context: .
    ports:
      - "8080:8080"
    volumes:
      - ${AGENT_FLOW_RUNTIME_PATH:-./config/runtime.example.yaml}:/etc/agent-flow/runtime.yaml:ro
      - ${AGENT_FLOW_PROVIDER_TOKEN_PATH:?set AGENT_FLOW_PROVIDER_TOKEN_PATH}:/run/secrets/agent-flow/provider-token:ro
      - ${AGENT_FLOW_CODEX_AUTH_PATH:?set AGENT_FLOW_CODEX_AUTH_PATH}:/run/secrets/agent-flow/codex-auth:ro
      - ${AGENT_FLOW_CLAUDE_AUTH_PATH:?set AGENT_FLOW_CLAUDE_AUTH_PATH}:/run/secrets/agent-flow/claude-auth:ro
      - ${AGENT_FLOW_DATA_PATH:-./.agent-flow-data}:/var/lib/agent-flow
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
